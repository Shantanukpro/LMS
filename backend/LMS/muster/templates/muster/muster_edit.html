<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muster Register - Edit Session</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Muster Register for {{ session.lab.name }}</h1>
        <p><strong>Date:</strong> {{ session.date }} | <strong>Time:</strong> {{ session.time }} | <strong>Class:</strong> {{ session.class_name }} | <strong>Batch:</strong> {{ session.batch }}</p>

        <div class="mb-3">
            <button id="addRowBtn" class="btn btn-outline-success me-2">Add Row</button>
            <button id="saveBtn" class="btn btn-primary">Save Register</button>
            <a href="{% url 'muster_list' %}" class="btn btn-outline-secondary">Back to List</a>
        </div>

        <table class="table table-bordered table-hover" id="musterTable">
            <thead class="table-light">
                <tr>
                    <th>Sr. No.</th>
                    <th>Roll No.</th>
                    <th>PC Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in entries %}
                <tr data-entry-id="{{ entry.id }}">
                    <td>{{ entry.sr_no }}</td>
                    <td><input type="text" class="form-control roll-no" value="{{ entry.roll_no }}"></td>
                    <td>
                        <select class="form-control pc-select">
                            <option value="">Select PC</option>
                            {% for pc in pcs %}
                                <option value="{{ pc.id }}" {% if pc.id == entry.pc_id %}selected{% endif %}>{{ pc.device_name }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger delete-row">Delete</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sessionId = {{ session.id }};
            const labId = {{ session.lab.id }};

            // Add row button
            document.getElementById('addRowBtn').addEventListener('click', function() {
                const tbody = document.querySelector('#musterTable tbody');
                const newRow = document.createElement('tr');
                const srNo = tbody.rows.length + 1;
                newRow.innerHTML = `
                    <td>${srNo}</td>
                    <td><input type="text" class="form-control roll-no"></td>
                    <td>
                        <select class="form-control pc-select">
                            <option value="">Select PC</option>
                            {% for pc in pcs %}
                                <option value="{{ pc.id }}">{{ pc.device_name }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger delete-row">Delete</button>
                    </td>
                `;
                tbody.appendChild(newRow);
                // Add delete event listener to the new button
                newRow.querySelector('.delete-row').addEventListener('click', function() {
                    if (tbody.rows.length > 1) {
                        tbody.removeChild(newRow);
                        // Update sr.no for remaining rows
                        updateSrNos();
                    }
                });
            });

            // Delete row button for existing rows
            document.querySelectorAll('.delete-row').forEach(button => {
                button.addEventListener('click', function() {
                    const tbody = document.querySelector('#musterTable tbody');
                    const row = button.closest('tr');
                    if (tbody.rows.length > 1) {
                        tbody.removeChild(row);
                        updateSrNos();
                    }
                });
            });

            // Save button
            document.getElementById('saveBtn').addEventListener('click', function() {
                const entries = [];
                const tbody = document.querySelector('#musterTable tbody');
                let valid = true;
                tbody.querySelectorAll('tr').forEach((row, index) => {
                    const srNo = index + 1;
                    const rollNoInput = row.querySelector('.roll-no');
                    const pcSelect = row.querySelector('.pc-select');
                    const rollNo = rollNoInput.value.trim();
                    const pcId = pcSelect.value;

                    if (!rollNo || !pcId) {
                        valid = false;
                        rollNoInput.classList.add('is-invalid');
                        pcSelect.classList.add('is-invalid');
                    } else {
                        rollNoInput.classList.remove('is-invalid');
                        pcSelect.classList.remove('is-invalid');
                    }

                    entries.push({
                        sr_no: srNo,
                        roll_no: rollNo,
                        pc_id: parseInt(pcId)
                    });
                });

                if (!valid) {
                    alert('Please fill in all fields (Roll No and PC) for each row.');
                    return;
                }

                fetch(`{% url 'save_muster_entries' session.id %}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ entries: entries })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert('Register saved successfully!');
                        // Optionally redirect to list or stay
                        window.location.href = "{% url 'muster_list' %}";
                    } else {
                        alert('Error saving register: ' + (data.error || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Failed to save register.');
                });
            });

            function updateSrNos() {
                const tbody = document.querySelector('#musterTable tbody');
                tbody.querySelectorAll('tr').forEach((row, index) => {
                    row.cells[0].textContent = index + 1;
                });
            }

            // Helper to get CSRF token
            function getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }
        });
    </script>
</body>
</html>
